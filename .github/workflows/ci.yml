name: CI

on:
  push:
    branches: [main, "claude/*"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, lint, unit-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gilifast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gilifast_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/gilifast_test
      AUTH_SECRET: ci-test-secret-at-least-32-chars
      QR_HMAC_SECRET: ci-test-qr-hmac-secret-at-least-32
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      # pnpm does not run dependency build scripts by default, so Playwright
      # never downloads its browsers during install and every test fails on
      # launch. Only chromium is needed — it is the sole project in
      # playwright.config.ts.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm prisma db push
      # The specs assert against fixed QA ids, so an empty database fails them
      # all regardless of the app being correct.
      - run: pnpm seed:qa
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
