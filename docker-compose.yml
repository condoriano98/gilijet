name: gilijet

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gilijet
      POSTGRES_USER: gilijet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gilijet -d gilijet"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gilijet:${POSTGRES_PASSWORD}@db:5432/gilijet?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?QR_HMAC_SECRET is required}
      APP_BASE_URL: ${APP_BASE_URL:-http://188.166.177.164}
      PLATFORM_COMMISSION_RATE: ${PLATFORM_COMMISSION_RATE:-0.08}
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-30}
      SEED_ON_START: ${SEED_ON_START:-0}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gilijet.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123}
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL:-operator@example.com}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-changeme123}

      # Payment gateways. Until these reach the container the app runs in mock
      # mode and takes no real money, whatever the dashboards say.
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_IS_PRODUCTION: ${PAYPAL_IS_PRODUCTION:-false}
      PAYPAL_PRESENTMENT_CURRENCY: ${PAYPAL_PRESENTMENT_CURRENCY:-USD}

      # Cron routes reject every call without this, so the FX refresh that
      # PayPal depends on cannot run until it is set.
      CRON_SECRET: ${CRON_SECRET:-}

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    # No host port: caddy terminates and proxies to us over the compose network.
    expose:
      - "3000"

  # Terminates TLS so live PayPal webhooks can be delivered — PayPal refuses to
  # post to a plain-HTTP endpoint. Certificates are issued and renewed by Caddy
  # from Let's Encrypt with no manual step, and persist in the caddy-data volume
  # so redeploys do not re-request them and burn rate limits.
  #
  # Set APP_DOMAIN in the env file and point its A record at this host. Left
  # empty, Caddy serves plain HTTP on :80 and the box behaves as it did before.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

  # Vercel Cron does not exist on this box, so vercel.json is inert here and
  # every scheduled route would simply never fire. PayPal refuses to quote on a
  # stale FX rate, so without this ticker it would never appear at checkout.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        if [ -z "$$CRON_SECRET" ]; then
          echo "[cron] CRON_SECRET is unset — cron routes will 401. Not starting."
          exit 1
        fi
        while true; do
          for route in refresh-fx; do
            code=$$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $$CRON_SECRET" \
              "http://app:3000/api/cron/$$route" || true)
            echo "[cron] $$route -> $$code"
          done
          sleep 3600
        done

volumes:
  db-data:
  caddy-data:
  caddy-config:
