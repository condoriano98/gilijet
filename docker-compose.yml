# The project is Gilifast. Four identifiers below deliberately still say
# "gilijet", and renaming them would take the production database offline:
#
#   * `name:` namespaces the volumes, so the live data lives in
#     `gilijet_db-data`. Renaming the project makes compose look for
#     `gilifast_db-data`, find nothing, and initialise an empty cluster.
#   * POSTGRES_DB / POSTGRES_USER do not rename anything on an already
#     initialised volume — they only change what the app asks for, and the
#     existing cluster has no `gilifast` role or database to hand it.
#
# They are internal storage names no customer ever sees. Renaming them is a
# dump-and-restore, not an edit; see the note in README.md.
name: gilijet

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gilijet
      POSTGRES_USER: gilijet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gilijet -d gilijet"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gilijet:${POSTGRES_PASSWORD}@db:5432/gilijet?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?QR_HMAC_SECRET is required}
      APP_BASE_URL: ${APP_BASE_URL:-http://188.166.177.164}
      PLATFORM_COMMISSION_RATE: ${PLATFORM_COMMISSION_RATE:-0.08}
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-30}
      SEED_ON_START: ${SEED_ON_START:-0}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gilifast.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123}
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL:-operator@example.com}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-changeme123}

      # Payment gateway. Until these reach the container the app runs in mock
      # mode and takes no real money, whatever the dashboard says.
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}

      # Backup gateway for cards Midtrans declines. PAYPAL_IS_PRODUCTION picks
      # the host the credentials are sent to; live keys against the sandbox
      # host come back 401 invalid_client and PayPal is silently not offered.
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_IS_PRODUCTION: ${PAYPAL_IS_PRODUCTION:-false}
      PAYPAL_PRESENTMENT_CURRENCY: ${PAYPAL_PRESENTMENT_CURRENCY:-USD}

      # Cron routes reject every call without this.
      CRON_SECRET: ${CRON_SECRET:-}

      # Kill switch for the auto-confirm sweep. Off unless explicitly "true",
      # so a fresh box never starts mailing boarding passes unattended.
      AUTO_CONFIRM_ENABLED: ${AUTO_CONFIRM_ENABLED:-false}

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    # No host port: caddy terminates and proxies to us over the compose network.
    expose:
      - "3000"

  # Terminates TLS so Midtrans notifications and card-holder traffic are not
  # carried in the clear. Certificates are issued and renewed by Caddy from
  # Let's Encrypt with no manual step, and persist in the caddy-data volume so
  # redeploys do not re-request them and burn rate limits.
  #
  # Set APP_DOMAIN in the env file and point its A record at this host. Left
  # empty, Caddy serves plain HTTP on :80 and the box behaves as it did before.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

  # Vercel Cron does not exist on this box, so vercel.json is inert here and
  # every scheduled route would simply never fire.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null 2>&1
        if [ -z "$$CRON_SECRET" ]; then
          echo "[cron] CRON_SECRET is unset — cron routes will 401. Not starting."
          exit 1
        fi
        hit() {
          # 120s, not 30s: an auto-confirm sweep renders up to 25 PDFs and makes
          # two sends each. A curl timeout does not cancel the server-side work
          # anyway — the route's own latch is what prevents pile-up.
          code=$$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $$CRON_SECRET" \
            "http://app:3000/api/cron/$$1" || true)
          echo "[cron] $$1 -> $$code"
        }
        # 300s is the base clock; slower routes run on a multiple of it. 12 ticks
        # = 1h, which keeps refresh-fx at the cadence it had before auto-confirm
        # needed a faster loop. tick starts at 0 so refresh-fx still fires on
        # container start, as the old loop did.
        tick=0
        while true; do
          hit auto-confirm
          if [ $$(( tick % 12 )) -eq 0 ]; then
            hit refresh-fx
          fi
          tick=$$(( tick + 1 ))
          sleep 300
        done

volumes:
  db-data:
  caddy-data:
  caddy-config:
