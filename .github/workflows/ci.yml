name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qc:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prisma generate (dummy URL)
        run: pnpm prisma generate
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          DIRECT_URL: postgresql://x:x@localhost:5432/x
      - run: pnpm qc

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gili
          POSTGRES_PASSWORD: gili
          POSTGRES_DB: gilijet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U gili"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://gili:gili@localhost:5432/gilijet_test
      DIRECT_URL: postgresql://gili:gili@localhost:5432/gilijet_test
      AUTH_SECRET: test-auth-secret-please-rotate
      QR_HMAC_SECRET: test-qr-hmac-secret-please-rotate-now
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma db push --skip-generate
      - run: pnpm seed:qa
      - name: install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
