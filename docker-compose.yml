name: gilijet

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gilijet
      POSTGRES_USER: gilijet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gilijet -d gilijet"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gilijet:${POSTGRES_PASSWORD}@db:5432/gilijet?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?QR_HMAC_SECRET is required}
      APP_BASE_URL: ${APP_BASE_URL:-http://188.166.177.164}
      PLATFORM_COMMISSION_RATE: ${PLATFORM_COMMISSION_RATE:-0.08}
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-30}
      SEED_ON_START: ${SEED_ON_START:-0}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gilijet.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123}
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL:-operator@example.com}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-changeme123}
    ports:
      # Bind directly to :80 on the host (HTTP only, no domain → no TLS).
      - "80:3000"

volumes:
  db-data:
